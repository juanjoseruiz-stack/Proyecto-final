<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Configuraciones</title>
    <link rel="stylesheet" href="configuraciones.css">
</head>
<body>
    <div class="page-container">
        <header class="top-bar">
            <a href="http://127.0.0.1:5500/Inicio.html" class="back-btn">← Volver al Menú</a>
            <h1 class="page-title">Configuraciones</h1>
        </header>

        <main class="settings-box">
            <div class="setting-item">
                <div>
                    <h3>Notificaciones por Correo</h3>
                    <p>Recibe avisos sobre tareas y eventos importantes.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div>
                    <h3>Sonidos de la Plataforma</h3>
                    <p>Reproduce efectos de audio al completar actividades.</p>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div>
                    <h3>Perfil Público</h3>
                    <p>Permite que otros compañeros vean tu progreso.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </main>
    </div>
</body>
</html>
