<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Materias Complementarias</title>
    
    <!-- CSS de estilos -->
    <link rel="stylesheet" href="progreso.css">
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>EduNexus</h1>
            <nav>
                <a href="../Inicio.html">Inicio</a>
                <a href="clases.html">Clases</a>
                <a href="diplomas.html">Diplomas</a>
                <a href="progreso.html" class="active">Progreso</a>
            </nav>
        </div>
    </header>

    <div id="react-complementarias-section"></div>

    <footer>
        <p>&copy; 2026 EduNexus. Todos los derechos reservados.</p>
    </footer>

    <script type="text/babel">
        const initialComplementariasData = {
            title: "Materias Complementarias",
            category: "Complementarias",
            modules: [
                {
                    id: 1,
                    title: "Unidad 1: Historia Universal y Ciencias Sociales",
                    lessons: [
                        { id: "1.1", name: "1.1 Civilizaciones Antiguas", done: true },
                        { id: "1.2", name: "1.2 Edad Media y Renacimiento", done: true },
                        { id: "1.3", name: "1.3 Revolución Industrial y Era Moderna", done: false },
                        { id: "1.4", name: "1.4 Geografía Humana y Política", done: false },
                        { id: "1.5", name: "1.5 Derechos Humanos y Ciudadanía", done: false }
                    ]
                },
                {
                    id: 2,
                    title: "Unidad 2: Arte, Filosofía y Cultura",
                    lessons: [
                        { id: "2.1", name: "2.1 Introducción al Pensamiento Filosófico", done: false },
                        { id: "2.2", name: "2.2 Historia del Arte y Vanguardias", done: false },
                        { id: "2.3", name: "2.3 Ética y Moral Contemporánea", done: false },
                        { id: "2.4", name: "2.4 Expresión Plástica y Creatividad", done: false },
                        { id: "2.5", name: "2.5 Apreciación Musical y Teatro", done: false }
                    ]
                },
                {
                    id: 3,
                    title: "Unidad 3: Tecnología y Habilidades Digitales",
                    lessons: [
                        { id: "3.1", name: "3.1 Alfabetización Digital y Seguridad", done: true },
                        { id: "3.2", name: "3.2 Pensamiento Computacional Básica", done: true },
                        { id: "3.3", name: "3.3 Herramientas de Ofimática", done: true },
                        { id: "3.4", name: "3.4 Uso Responsable de Redes Sociales", done: false },
                        { id: "3.5", name: "3.5 Fundamentos de Programación Web", done: false }
                    ]
                }
            ]
        };

        function ComplementariasSection() {
            const [modules, setModules] = React.useState(initialComplementariasData.modules);

            const toggleLesson = (moduleId, lessonId) => {
                setModules(prevModules =>
                    prevModules.map(module => {
                        if (module.id !== moduleId) return module;
                        return {
                            ...module,
                            lessons: module.lessons.map(lesson =>
                                lesson.id === lessonId ? { ...lesson, done: !lesson.done } : lesson
                            )
                        };
                    })
                );
            };

            const totalLessons = modules.reduce((acc, m) => acc + m.lessons.length, 0);
            const lessonsCompleted = modules.reduce((acc, m) => acc + m.lessons.filter(l => l.done).length, 0);
            const overallProgress = totalLessons > 0 ? Math.round((lessonsCompleted / totalLessons) * 100) : 0;

            return (
                <section className="courses-section">
                    {/* Botón de Regreso Superior */}
                    <a href="progreso.html" className="btn-enter btn-back" style={{
                        display: 'inline-flex',
                        alignItems: 'center',
                        gap: '0.5rem',
                        marginBottom: '1.5rem',
                        textDecoration: 'none'
                    }}>
                        <span className="arrow">&larr;</span>
                        <span>Volver al Progreso</span>
                    </a>

                    <div className="section-header">
                        <h2>{initialComplementariasData.title}</h2>
                        <p>
                            Avance general: <strong>{overallProgress}%</strong> ({lessonsCompleted} de {totalLessons} lecciones)
                        </p>

                        <div style={{
                            width: '100%',
                            height: '10px',
                            backgroundColor: 'rgba(255,255,255,0.1)',
                            borderRadius: '5px',
                            overflow: 'hidden',
                            marginTop: '0.8rem'
                        }}>
                            <div style={{
                                width: `${overallProgress}%`,
                                height: '100%',
                                backgroundColor: 'var(--accent-cyan, #06b6d4)',
                                transition: 'width 0.4s ease'
                            }}></div>
                        </div>
                    </div>

                    <div className="courses-grid" style={{ marginTop: '2rem' }}>
                        {modules.map(module => {
                            const completedCount = module.lessons.filter(l => l.done).length;
                            const totalCount = module.lessons.length;
                            const moduleProgress = Math.round((completedCount / totalCount) * 100);

                            let status = "Pendiente";
                            if (moduleProgress === 100) status = "Completado";
                            else if (moduleProgress > 0) status = "En Progreso";

                            return (
                                <article key={module.id} className="course-card">
                                    <div className="card-content">
                                        <span className="course-category">{initialComplementariasData.category}</span>
                                        <h3>{module.title}</h3>
                                        <p>Avance del módulo: {completedCount}/{totalCount} lecciones</p>

                                        <ul className="lessons-list">
                                            {module.lessons.map(lesson => (
                                                <li
                                                    key={lesson.id}
                                                    className={`lesson-item ${lesson.done ? 'completed' : 'pending'}`}
                                                    onClick={() => toggleLesson(module.id, lesson.id)}
                                                    style={{ cursor: 'pointer', userSelect: 'none' }}
                                                >
                                                    <span className="lesson-icon">
                                                        {lesson.done ? (
                                                            <svg className="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                                <polyline points="20 6 9 17 4 12"></polyline>
                                                            </svg>
                                                        ) : (
                                                            <span className="circle-icon"></span>
                                                        )}
                                                    </span>
                                                    <span className="lesson-name">{lesson.name}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="card-footer">
                                        <span className={`course-lessons status-${status.toLowerCase().replace(' ', '-')}`}>
                                            Estado: {status}
                                        </span>
                                        <span className="course-rating">
                                            {moduleProgress}%
                                        </span>
                                    </div>
                                </article>
                            );
                        })}
                    </div>
                </section>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-complementarias-section'));
        root.render(<ComplementariasSection />);
    </script>
</body>
</html>
