<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Clase de Programación</title>
    <!-- Enlace al archivo CSS de Programación -->
    <link rel="stylesheet" href="clase-programacion-live.css">
</head>

<body>
    <div class="dashboard-layout">
        
        <!-- Barra Superior -->
        <header class="top-bar">
            <h1 class="app-title">EduNexus</h1>
        </header>

        <!-- Contenedor Principal -->
        <main class="main-container">
            <!-- Botón de retorno al menú principal -->
            <a href="clases.html" class="btn-back">&#8592; Volver al Menú Principal</a>

            <!-- Tarjeta Exclusiva de Ingreso a la Clase -->
            <article class="course-card">
                <header>
                    <span class="badge">Programación</span>
                    <h1 class="guide-title">Clase Virtual de Programación</h1>
                    <p class="guide-subtitle">Aula Interactiva</p>
                </header>

                <div class="guide-content">
                    <section class="live-session-card">
                        <div class="live-status">
                            <span class="status-dot"></span>
                            <span id="session-text">Estado: Clase disponible</span>
                        </div>
                        <p class="live-desc">Haz clic en el botón a continuación para ingresar directamente a tu sala de Google Meet.</p>
                        
                        <div class="api-action-box">
                            <a href="https://meet.google.com/abc-defg-hij" target="_blank" class="btn-meet">
                                📹 Conectarse a la clase
                            </a>
                        </div>
                    </section>
                </div>
            </article>
        </main>
        
    </div>
</body>

</html>
