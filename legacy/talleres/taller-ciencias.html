<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Taller #1 de Ciencias</title>

    <!-- HOJA DE ESTILOS FUTURISTA COMPARTIDA -->
    <link rel="stylesheet" href="talleres.css">
    
    <!-- React, ReactDOM y Babel por CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function TallerDetalleView() {
            const [showMenu, setShowMenu] = React.useState(false);

            const tallerData = {
                title: "Taller #1 de ciencias",
                category: "Ciencias Naturales",
                code: "TAL-SCI-01",
                imageUrl: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=800&auto=format&fit=crop&q=80",
                description: "En este taller práctico aprenderemos los principios del método científico, la formulación de hipótesis y el análisis de experimentos en el laboratorio.",
                guides: [
                    { id: 1, name: "Guía 1: Introducción al Método Científico.pdf", size: "1.2 MB", url: "#" },
                    { id: 2, name: "Guía 2: Plantilla de Laboratorio y Registro.pdf", size: "850 KB", url: "#" }
                ],
                interactiveLink: "taller-interactivo.html"
            };

            const handleBackToTalleres = () => {
                window.location.href = "talleres.html";
            };

            const handleStartInteractive = () => {
                window.location.href = tallerData.interactiveLink;
            };

            const handleDownload = (guideName) => {
                console.log(`Descargando: ${guideName}`);
            };

            return (
                <div className="talleres-page">
                    {/* Encabezado Superior */}
                    <header className="top-bar">
                        <div className="top-bar-left">
                            <button 
                                className="icon-btn" 
                                aria-label="Volver a talleres"
                                onClick={handleBackToTalleres}
                            >
                                ⬅
                            </button>
                            <span className="app-title">{tallerData.title}</span>
                        </div>

                        <div className="top-bar-right" style={{ position: 'relative' }}>
                            <button
                                className="icon-btn"
                                aria-label="Menú"
                                onClick={() => setShowMenu(!showMenu)}
                            >
                                ☰
                            </button>

                            {showMenu && (
                                <nav className="dropdown-menu">
                                    <a href="../guias/guias.html">Guías</a>
                                    <a href="../clases/clases.html">Clases</a>
                                    <a href="#">Ocupaciones</a>
                                    <a href="../materias/materias.html">Materias complementarias</a>
                                    <button className="btn-add-action">+ Agregar</button>
                                </nav>
                            )}
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="talleres-container" style={{ maxWidth: '750px', margin: '0 auto' }}>
                        <article className="taller-card" style={{ cursor: 'default', padding: '1.5rem', width: '100%' }}>
                            
                            {/* Imagen de Cabecera */}
                            <div className="card-image-wrapper" style={{ height: '240px', width: '100%', overflow: 'hidden', borderRadius: '12px' }}>
                                <img 
                                    src={tallerData.imageUrl} 
                                    alt={tallerData.title} 
                                    className="card-img" 
                                    style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                                />
                            </div>

                            {/* Etiquetas y Código */}
                            <div style={{ display: 'flex', gap: '0.8rem', margin: '1rem 0', alignItems: 'center' }}>
                                <span className="badge-code" style={{ fontFamily: 'monospace', background: 'rgba(255,255,255,0.08)', padding: '0.2rem 0.6rem', borderRadius: '4px', color: 'var(--accent-cyan)' }}>
                                    {tallerData.code}
                                </span>
                                <span style={{ color: 'var(--accent-emerald)', background: 'rgba(52, 211, 153, 0.15)', padding: '0.2rem 0.6rem', borderRadius: '12px', fontSize: '0.8rem', fontWeight: 'bold' }}>
                                    {tallerData.category}
                                </span>
                            </div>

                            {/* Título y Descripción */}
                            <h2 style={{ fontSize: '1.6rem', color: '#ffffff', marginBottom: '0.8rem' }}>
                                {tallerData.title}
                            </h2>

                            <p style={{ color: '#e2e8f0', marginBottom: '1.5rem', fontSize: '0.95rem', lineHeight: '1.6' }}>
                                {tallerData.description}
                            </p>

                            {/* Descarga de Archivos / Guías */}
                            <div style={{ width: '100%', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '1.2rem' }}>
                                <h3 style={{ fontSize: '1.05rem', color: 'var(--accent-cyan)', marginBottom: '0.8rem' }}>
                                    Materiales y Recursos
                                </h3>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                                    {tallerData.guides.map(guide => (
                                        <div 
                                            key={guide.id}
                                            style={{
                                                background: 'rgba(15, 23, 42, 0.6)',
                                                border: '1px solid var(--border-glow, rgba(255,255,255,0.1))',
                                                padding: '0.75rem 1rem',
                                                borderRadius: '8px',
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'center'
                                            }}
                                        >
                                            <span style={{ fontSize: '0.9rem', color: '#f8fafc' }}>
                                                📄 {guide.name} <small style={{ color: '#94a3b8', marginLeft: '0.5rem' }}>({guide.size})</small>
                                            </span>
                                            <button 
                                                className="icon-btn" 
                                                style={{ fontSize: '0.8rem', padding: '0.3rem 0.7rem' }}
                                                onClick={() => handleDownload(guide.name)}
                                            >
                                                Descargar
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Botón Principal */}
                            <button 
                                className="btn-add-action" 
                                onClick={handleStartInteractive}
                                style={{
                                    marginTop: '1.8rem',
                                    width: '100%',
                                    background: 'linear-gradient(135deg, var(--accent-cyan, #06b6d4), var(--accent-indigo, #6366f1))',
                                    color: '#ffffff',
                                    padding: '0.8rem',
                                    borderRadius: '10px',
                                    boxShadow: '0 4px 15px rgba(56, 189, 248, 0.3)',
                                    cursor: 'pointer',
                                    fontWeight: 'bold',
                                    border: 'none'
                                }}
                            >
                                Iniciar Taller Interactivo
                            </button>

                        </article>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TallerDetalleView />);
    </script>
</body>
</html>
